<section class="logos-section u-section-240" id="the-logos">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
			>
				<div class="label-badge" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="100">
					<div class="dot"></div>

					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
					>
						{{ 'LOGOS.BADGE' | translate }}
					</span>
				</div>
				<div class="logos-section__grid">
					<!-- CONTENT -->
					<div class="logos-section__content">
						<h2
							class="size56 mb-md-5 mb-sm-3 mb-2 lufgalight minusletterspace2 lineheight56"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<span class="c-text-textcolor1">
								{{ 'LOGOS.TITLE1' | translate }}
							</span>

							<br class="d-none d-md-block" />

							<span class="c-text-textcolor1">
								{{ 'LOGOS.TITLE2' | translate }}
							</span>
							<span class="lufgasemibold c-text-textcolor1">
								{{ 'LOGOS.TITLE3' | translate }}
							</span>
						</h2>
					</div>

					<!-- LOGOS -->
					<div
						class="logos-section__logos"
						data-aos="fade-up"
						data-aos-duration="2000"
						data-aos-delay="300"
					>
						@for (track of logoTracks; track $index; let trackIndex = $index) {
							<div class="logo-marquee" [class.logo-marquee--reverse]="trackIndex % 2 === 1">
								<div class="logo-marquee__track">
									@for (logo of track; track logo.id) {
										<div class="client-logo">
											<img [src]="logo.src" [alt]="logo.alt || logo.title" loading="eager" />
										</div>
									}

									<!-- Duplicate for seamless infinite loop -->
									@for (logo of track; track logo.id + '-duplicate') {
										<div class="client-logo">
											<img [src]="logo.src" [alt]="logo.alt || logo.title" loading="eager" />
										</div>
									}
								</div>
							</div>
						}
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

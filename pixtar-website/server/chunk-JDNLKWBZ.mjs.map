<div class="phone-input">
	<label
		for="floatingInput"
		class="lufgaregular"
		[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
	>
		{{ 'PHONE.WHAT_YOUR_MOBILE_NUMBER' | translate }}
	</label>
	<div class="input-group d-block form-floating">
		<!-- ✅ FLAG -->
		<div class="flag-box d-flex">
			<div class="custom-dropdown">
				<!-- Selected -->
				<button
					type="button"
					class="dropdown-toggle lufgaregular"
					(click)="toggleDropdown()"
					aria-haspopup="listbox"
					[attr.aria-expanded]="isOpen"
				>
					<img
						[src]="getFlag(selectedCountry.code)"
						width="20"
						height="15"
						alt="{{ selectedCountry.name }}"
						title="{{ selectedCountry.name }}"
					/>
					<span class="c-text-textcolor1">{{ selectedCountry.dialCode }}</span>
					<!-- <span class="arrow">▼</span> -->
				</button>

				<!-- Dropdown list -->
				<ul *ngIf="isOpen" class="dropdown-menu" role="listbox">
					<li *ngFor="let c of countries" (click)="selectCountry(c)" role="option">
						<img
							[src]="getFlag(c.code)"
							width="20"
							height="15"
							alt="selectCountry(c)"
							title="selectCountry(c)"
							loading="lazy"
						/>
						<span class="c-text-textcolor1">{{ c.name }}</span>
						<span class="code">{{ c.dialCode }}</span>
					</li>
				</ul>
			</div>
			<input
				type="tel"
				name="phone"
				autocomplete="off"
				[formControl]="phoneControl"
				class="form-control lufgaregular"
				id="floatingInput"
				(input)="onInputChange($event.target.value)"
				placeholder=""
				[attr.maxlength]="getExpectedPhoneLength()"
			/>
		</div>

		<p *ngIf="phoneErrorMessage" class="error lufgaregular size14">
			{{ phoneErrorMessage }}
		</p>
	</div>
</div>

<section class="brand-audit-section">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-9 col-lg-9 col-xl-9 col-md-11 col-sm-11 col-11 mx-auto position-relative"
				data-aos="fade-up"
				data-aos-duration="2000"
				data-aos-delay="100"
			>
				<div class="label-badge" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="100">
					<div class="dot"></div>
					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size14 '"
						>{{ sectionKey + '.BADGE' | translate }}</span
					>
				</div>

				<h2 class="lufgalight size90 mb-lg-5 mb-3">
					<ng-container *ngFor="let part of getTitleParts()">
						<br class="d-none d-md-block" *ngIf="part.break" />
						<span
							[class.lufgamedium]="part.style === 'medium'"
							[class.barcely]="part.style === 'barcely'"
							>{{ part.text }}</span
						>
					</ng-container>
				</h2>

				<p
					*ngFor="let description of getDescriptions()"
					class="mb-4 lufgaregular size24 lineheight51"
					data-aos="fade-up"
					data-aos-duration="1200"
				>
					{{ description }}
				</p>

				<a
					[routerLink]="consultationLink"
					class="lufgasemibold slideup-btn size14"
					data-aos="fade-up"
					data-aos-duration="1000"
				>
					<span>
						{{ sectionKey + '.BUTTON' | translate }}
					</span>
					<span>
						{{ sectionKey + '.BUTTON' | translate }}
					</span>
				</a>
			</div>
		</div>
	</div>
</section>

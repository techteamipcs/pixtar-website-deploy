<section class="card-section">
  <div class="container p-0">
    <div>
      <div class="col-xxl-4 col-lg-5 col-md-6 col-sm-8 col-12 p-0 m-auto">
        <div class="d-sm-flex d-block align-items-center justify-content-center vh-100 coverflow-hidden">
          <div class="card">

            <!-- Logo -->
            <img
              [src]="base + 'pixtar-white-logo.svg'"
              class="card-logo"
              alt="Pixtar Logo" width="28" height="34" 
              loading="lazy" />

            <!-- Profile Image -->
            <img
              [src]="base + profile.photo"
              class="card-img-top" width="408" height="450" 
              [alt]="profile.name"
              loading="eager" />

            <div class="card-body">
              <div class="col-xxl-9 col-xl-10 col-lg-10 col-md-10 col-sm-10 col-10 mx-auto h-100">
                <div class="d-sm-flex d-flex justify-content-evenly flex-column h-100 customflex">

                  <!-- Profile Info -->
                  <div class="profile-name text-center">
                    <h4>{{ profile.name }}</h4>
                    <p>{{ profile.title }}</p>
                  </div>

                  <!-- Contact Info -->
                  <div class="account-block">
                    <div>

                      <!-- Phone -->
                      <div class="d-flex mb-2">
                        <div class="p-0 text-center ph">
                          <a [href]="'tel:' + profile.phone">
                            <img
                              [src]="base + 'phone.svg'"
                              alt="Phone"
                              class="me-2" width="40" height="40"
                              loading="lazy" />
                          </a>
                        </div>

                        <div>
                          <a [href]="'tel:' + profile.phone">
                            <span>{{ profile.phone }}</span>
                          </a>
                        </div>
                      </div>

                      <!-- Email -->
                      <div class="d-flex">
                        <div class="p-0 text-center em">
                          <a [href]="'mailto:' + profile.email" target="_blank">
                            <img
                              [src]="base + 'email.svg'"
                              alt="Email"
                              class="me-2" width="40" height="40"
                              loading="lazy" />
                          </a>
                        </div>

                        <div>
                          <a [href]="'mailto:' + profile.email" target="_blank">
                            <span>{{ profile.email }}</span>
                          </a>
                        </div>
                      </div>

                    </div>
                  </div>

                  <!-- Social Links -->
                  <div class="social-links">
                    <div class="d-flex flex-row justify-content-between contact align-items-center">

                      <!-- Save Contact -->
                      <a
                        [href]="base + profile.vcfPath"
                        [download]="profile.fileName + '.vcf'"
                        class="contact-btn">
                        Save Contact
                      </a>

                      <!-- Dynamic Social Links -->
                      @for (link of profile.socialLinks; track link.href) {
                        <p>
                          <a [href]="link.href" target="_blank">
                            <img
                              [src]="base + link.icon"
                              [alt]="link.alt"
                              [width]="link.width ?? 35"
                              [height]="link.height ?? 35"
                              loading="lazy" />
                          </a>
                        </p>
                      }

                    </div>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

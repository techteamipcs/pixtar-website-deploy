<section class="u-section-80 choosesection bannerLightColor">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-11 col-md-11 col-sm-11 col-11 mx-auto"
				data-aos="fade-up"
				data-aos-duration="2000"
				data-aos-delay="100"
			>
				<div class="choose-section">
					<div class="label-badge mx-auto" *ngIf="showBadge">
						<div class="dot"></div>

						<span
							class="lufgasemibold text-uppercase letterspacing10"
							[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
						>
							{{ 'CHOOSE_SECTION.BADGE' | translate }}
						</span>
					</div>
					<p class="h1 weight300 text-center">
						<span class="textcolor1 size55 lufgalight">{{
							'CHOOSE_SECTION.why_choose' | translate
						}}</span>
						<span class="textcolor1 size55 lufgabold">{{
							'CHOOSE_SECTION.pixtar' | translate
						}}</span>
					</p>
					<div class="mtrem5">
						<div class="row">
							<div
								*ngFor="let item of items; let i = index"
								[class]="
									i === 1 ? 'col-md-4 mt-md-0 mt-sm-4 mb-md-0 mb-sm-4 mb-4 mt-4' : 'col-md-4'
								"
							>
								<div class="box text-center">
									<img
										class="mb30 mx-auto"
										src="{{ baseUrl }}/art-icons/{{ item.icon }}"
										alt="{{ item.alt }}"
										title="{{ item.title }}"
										[attr.width]="item.width"
										[attr.height]="item.height"
										loading="lazy"
									/>
									<p
										class="c-text-textcolor1 weight600 p1"
										[class]="translationService.currentLang() === 'ar' ? 'size28' : 'size20'"
									>
										{{ 'CHOOSE_SECTION.' + item.titleKey | translate }}
									</p>
									<p
										class="c-text-textcolor3 p2"
										[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size18'"
									>
										{{ 'CHOOSE_SECTION.' + item.descKey | translate }}
									</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

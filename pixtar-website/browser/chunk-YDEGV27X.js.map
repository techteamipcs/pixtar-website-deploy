<app-services-banner
	[product]="bannerData"
	[contentClass]="'contentbl'"
	[imagePosition]="
		translationService.currentLang() === 'ar' ? 'banner-left-shift' : 'banner-right-shift'
	"
	[isDark]="false"
	[videoUrl]="baseUrl + '/videos/services/website-page-video.mp4'"
></app-services-banner>
<app-logos> </app-logos>
<app-position [sectionKey]="'THEPOSITION.MAINTENANCE'"></app-position>
<app-what-you-get [sectionKey]="'WHATYOUGET.MAINTENANCE'"></app-what-you-get>
<app-recent-work-marquee
	serviceName="website"
	consultationLink="/contact"
	[showTechStack]="true"
></app-recent-work-marquee>

<app-template-question [sectionKey]="'TEMPLATEQUESTION.MAINTENANCE'"></app-template-question>
<app-situations [sectionKey]="'SITUATIONS.MAINTENANCE'"></app-situations>

<app-choose-section [showBadge]="true"></app-choose-section>

<app-cost-card></app-cost-card>
<app-turnaround sectionKey="TURNAROUND.MAINTENANCE"></app-turnaround>
<app-service-stages
	consultationLink="/services/website-maintenance#packages"
	[sectionKey]="'SERVICESTAGES.MAINTENANCE'"
></app-service-stages>

<app-testimonials [testimonials]="websiteTestimonials"></app-testimonials>
<app-serve-global></app-serve-global>

<app-blog></app-blog>
<app-creativity-banner></app-creativity-banner>
<app-faq [accordionItems]="websiteFaqs"></app-faq>
<app-discovery></app-discovery>

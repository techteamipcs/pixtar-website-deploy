<section class="u-section-80 position bannerLightColor" id="the-postion">
	<div class="new-container">
		<div class="row">
			<div class="col-xxl-10 col-xl-10 col-lg-10 col-md-11 col-sm-11 col-11 mx-auto px-md-4">
				<div class="label-badge" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="100">
					<div class="dot"></div>

					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
					>
						{{ sectionKey + '.BADGE' | translate }}
					</span>
				</div>
				<div class="row">
					<!-- Badge -->

					<!-- Heading -->
					<h2
						class="size90 mb30 lufgalight minusletterspace2 lineheight90"
						data-aos="fade-up"
						data-aos-duration="2000"
						data-aos-delay="100"
					>
						<ng-container *ngFor="let part of getTitleParts()">
							<br class="d-none d-md-block" *ngIf="part.break" />

							<span
								[class.c-text-textcolor1]="part.color === 'textcolor1' && part.style !== 'script'"
								[class.c-text-textcolor2]="part.color === 'textcolor2' && part.style !== 'script'"
								[class.fame-orange]="part.style === 'script'"
								[class.lufgamedium]="part.style === 'medium'"
								[class.barcely]="part.style === 'script'"
							>
								{{ part.text }}
							</span>
						</ng-container>
					</h2>

					<p
						*ngFor="let description of getDescriptions(); let i = index"
						class="mb30 c-text-textcolor1 lineheight32 para-width"
						[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size24'"
						[class.lufgaregular]="!description.bold"
						[class.lufgamedium]="description.bold"
						data-aos="fade-up"
						data-aos-duration="2000"
						[attr.data-aos-delay]="100 + i * 50"
					>
						{{ description.text }}
					</p>
				</div>
			</div>
		</div>
	</div>
</section>

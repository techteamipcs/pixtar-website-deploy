<section class="u-section-80 position bannerLightColor" id="the-postion">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
				data-aos="fade-up"
				data-aos-duration="2000"
				data-aos-delay="100"
			>
				<div class="row">
					<div class="col-lg-6 col-12">
						<div class="label-badge">
							<div class="dot"></div>
							<span
								class="lufgasemibold text-uppercase letterspacing10"
								[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size14 '"
								>{{ 'AI.BADGE' | translate }}</span
							>
						</div>

						<h2 class="lufgalight size90 mb-30">
							{{ 'AI.TITLE1' | translate }}
							<br class="d-none d-md-block" />

							<span class="lufgamedium size90">
								{{ 'AI.TITLE2' | translate }}
							</span>
							<br class="d-none d-md-block" />
							<span class="lufgamedium size90">
								{{ 'AI.TITLE3' | translate }}
							</span>
						</h2>

						<div class="ai-description size24 lufgaregular">
							<p class="size24 lufgaregular mb-lg-4 mb-2">
								{{ 'AI.DESCRIPTION1' | translate }}
							</p>

							<p class="size24 lufgaregular mb-lg-4 mb-2">
								{{ 'AI.DESCRIPTION2' | translate }}
							</p>

							<p class="size24 lufgamedium">{{ 'AI.DESCRIPTION3' | translate }}</p>
						</div>
					</div>

					<div class="col-lg-6 col-12">
						<div class="ai-visual">
							<img
								src="/images/new-images/ai-circle.png"
								alt=""
								title=""
								class=""
								loading="lazy"
								width=""
								height=""
							/>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

<section class="u-section-80 bannerLightColor" id="obvious-question">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
				data-aos="fade-up"
				data-aos-duration="2000"
				data-aos-delay="100"
			>
				<div
					class="label-badge"
					data-aos="fade-up"
					data-aos-duration="2000"
					data-aos-delay="100"
					*ngIf="keyExists(sectionKey + '.BADGE')"
				>
					<div class="dot"></div>

					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
					>
						{{ sectionKey + '.BADGE' | translate }}
					</span>
				</div>
				<div class="row align-items-start">
					<!-- Left -->
					<div class="col-lg-6 col-12 mb-3 mb-lg-0">
						<!-- Heading -->
						<h2
							class="size56 mb-md-5 mb-sm-3 mb-2 lufgalight lineheight56 minusletterspace2"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<ng-container *ngFor="let part of getTitleParts()">
								<br class="d-none d-md-block" *ngIf="part.break" />
								<span [class.lufgasemibold]="part.style === 'bold'">{{ part.text }}</span>
							</ng-container>
						</h2>
					</div>

					<!-- Right -->
					<div class="col-lg-6 col-12">
						<!-- Paragraph 1 -->
						<p
							class="lufgaregular size24"
							data-aos="fade-up"
							data-aos-duration="1200"
							data-aos-delay="100"
							*ngIf="getParagraphParts('PARAGRAPH1_PARTS').length"
						>
							<ng-container *ngFor="let part of getParagraphParts('PARAGRAPH1_PARTS')">
								<span [class.lufgasemibold]="part.bold">{{ part.text }}</span>
							</ng-container>
						</p>

						<!-- Pull Quote -->
						<blockquote
							class="obvious-quote lufgasemibold size24 my-md-5 my-3"
							data-aos="fade-up"
							data-aos-duration="1200"
							data-aos-delay="200"
							*ngIf="keyExists(sectionKey + '.QUOTE')"
						>
							{{ sectionKey + '.QUOTE' | translate }}
						</blockquote>

						<!-- Paragraph 2 -->
						<p
							class="lufgaregular size24"
							data-aos="fade-up"
							data-aos-duration="1200"
							data-aos-delay="300"
							*ngIf="getParagraphParts('PARAGRAPH2_PARTS').length"
						>
							<ng-container *ngFor="let part of getParagraphParts('PARAGRAPH2_PARTS')">
								<span [class.lufgasemibold]="part.bold">{{ part.text }}</span>
							</ng-container>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

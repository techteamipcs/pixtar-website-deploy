<a class="blog-card-link" [href]="post.link" [attr.aria-label]="post.title">
	<article class="blog-card">
		<div class="blog-card-content">
			<span class="blog-date size12 lufgalight c-text-textcolor2">
				{{ post.date | date: 'MMM d, y' }}
			</span>

			<h3 class="blog-title size32 lufgaregular c-text-textcolor1 lineheight32">
				{{ displayTitle }}
			</h3>

			<div class="blog-description-wrapper mt-md-5 mt-3">
				<p
					class="blog-description size16 lufgaregular c-text-textcolor2 lineheight24"
					innerHTML="{{ displayDescription }}"
				></p>
				<span class="blog-read-more size14 lufgaregular c-text-textcolor1">
					{{ translationService.currentLang() === 'ar' ? 'اقرأ المزيد' : 'Read More' }}
				</span>
			</div>

			@if (post.category) {
				<span class="blog-category size14 lufgaregular c-text-textcolor1">
					{{ post.category }}
				</span>
			}
		</div>

		<div class="blog-image-wrapper p-1" #imageWrapper>
			@if (post.imageUrl) {
				<img
					[src]="post.imageUrl"
					[alt]="post.imageAlt"
					class="blog-image"
					loading="lazy"
					decoding="async"
				/>
			}

			<div class="blog-cursor-wrapper" #cursorWrapper>
				<div class="blog-cursor" #cursorPill>
					<span class="blog-cursor__label size16 lufgasemibold">
						{{ translationService.currentLang() === 'ar' ? 'عرض المدونات' : 'View Blog' }}
					</span>
				</div>
			</div>
		</div>
	</article>
</a>

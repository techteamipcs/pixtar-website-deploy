<section class="cstvideo">
	<div
		class="video-marquee"
		aria-hidden="true"
		[class.video-marquee--rtl]="translationService.currentLang() === 'ar'"
	>
		<div
			class="video-marquee__track lufgamedium size90"
			data-aos="fade-up"
			data-aos-duration="2000"
			data-aos-delay="100"
		>
			<span class="me-2"> {{ 'VIDEO.VIDEO_CONTENT.MARQUE' | translate }} </span>
			<span class="me-2"> {{ 'VIDEO.VIDEO_CONTENT.MARQUE' | translate }} </span>
			<span class="me-2"> {{ 'VIDEO.VIDEO_CONTENT.MARQUE' | translate }} </span>
			<span class="me-2"> {{ 'VIDEO.VIDEO_CONTENT.MARQUE' | translate }} </span>
			<span aria-hidden="true"> {{ 'VIDEO.VIDEO_CONTENT.TITLE' | translate }} </span>
		</div>
	</div>
	<div class="new-container">
		<div class="row">
			<div class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto">
				<div class="video-frame" #videoFrame>
					<video
						#mobileVideo
						width="100%"
						preload="none"
						playsinline
						muted
						[muted]="true"
						loop
						(click)="playVideoInModal()"
						class="d-md-none d-block"
					>
						<source [src]="baseUrl + '/videos/home/home-mobile-page-video.mp4'" type="video/mp4" />
						<track
							kind="captions"
							[src]="baseUrl + '/videos/home/home-video-captions.vtt'"
							srclang="en"
							label="English"
						/>
					</video>

					<video
						#desktopVideo
						width="100%"
						(click)="playVideoInModal()"
						preload="none"
						playsinline
						muted
						[muted]="true"
						loop
						class="d-none d-md-block"
					>
						<source [src]="baseUrl + '/videos/home/home-desktop-page-video.mp4'" type="video/mp4" />
						<track
							kind="captions"
							[src]="baseUrl + '/videos/home/home-video-captions.vtt'"
							srclang="en"
							label="English"
						/>
					</video>

					<div class="video-hover-btn" #videoHoverBtn>
						<div class="video-hover-btn__inner" #videoHoverBtnInner>
							<lucide-icon name="play" class="video-hover-btn__icon"></lucide-icon>

							<span class="video-hover-btn__label size16 lufgasemibold">
								{{ 'VIDEO.VIDEO_CONTENT.TITLE' | translate }}
							</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="video-modal" #videoModal>
		<button type="button" class="video-modal__close" (click)="closeVideoModal()">
			<lucide-icon name="x"></lucide-icon>
		</button>
		<div class="video-modal__backdrop" (click)="closeVideoModal()"></div>

		<div class="video-modal__content">
			<video #modalMobileVideo class="d-block d-md-none" playsinline preload="metadata">
				<source [src]="baseUrl + '/videos/home/home-mobile-page-video.mp4'" type="video/mp4" />
				<track
					kind="captions"
					[src]="baseUrl + '/videos/home/home-video-captions.vtt'"
					srclang="en"
					label="English"
				/>
			</video>

			<video #modalDesktopVideo class="d-none d-md-block" playsinline preload="metadata">
				<source [src]="baseUrl + '/videos/home/home-desktop-page-video.mp4'" type="video/mp4" />
				<track
					kind="captions"
					[src]="baseUrl + '/videos/home/home-video-captions.vtt'"
					srclang="en"
					label="English"
				/>
			</video>
		</div>
	</div>
</section>

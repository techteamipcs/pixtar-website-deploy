<app-services-banner
	[product]="bannerData"
	[contentClass]="'contentbl'"
	[imagePosition]="
		translationService.currentLang() === 'ar' ? 'banner-left-shift' : 'banner-right-shift'
	"
	[isDark]="false"
	[videoUrl]="baseUrl + '/videos/services/website-page-video.mp4'"
></app-services-banner>
<app-logos> </app-logos>
<app-position [sectionKey]="'THEPOSITION.WEBSITE'"></app-position>
<app-what-you-get [sectionKey]="'WHATYOUGET.BRANDING'"></app-what-you-get>
<app-recent-work-marquee
	serviceName="website"
	consultationLink="/contact"
	[showTechStack]="true"
></app-recent-work-marquee>

<app-template-question [sectionKey]="'TEMPLATEQUESTION.WEBSITE'"></app-template-question>

<app-choose-section></app-choose-section>

<app-ai-section></app-ai-section>

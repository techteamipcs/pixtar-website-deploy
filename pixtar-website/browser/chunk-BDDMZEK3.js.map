<section class="global-section u-section-180">
	<div class="new-container" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
		<div class="row">
			<div class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto">
				<div class="row align-items-center">
					<!-- Content -->

					<div class="col-lg-5 col-12">
						<!-- Label -->
						<span class="c-text-textcolor1 size12 lufgasemibold text-uppercase white-label-badge">
							{{ 'SERVEGLOBAL.BADGE' | translate }}
						</span>
						<div
							class="global-section__content"
							data-aos="fade-up"
							data-aos-duration="1500"
							data-aos-delay="100"
						>
							<!-- Heading -->
							<h2 class="lufgalight size90 mb-4 lineheight90">
								{{ 'SERVEGLOBAL.TITLE1' | translate }}
								<span class="barcely">
									{{ 'SERVEGLOBAL.TITLE2' | translate }}
								</span>
								{{ 'SERVEGLOBAL.TITLE3' | translate }}
								<span class="lufgamedium inline text-white">
									{{ 'SERVEGLOBAL.TITLE4' | translate }}
								</span>
							</h2>

							<!-- Description -->
							<div class="size24 lineheight51">
								<p class="mb-0 lufgaregular">
									{{ 'SERVEGLOBAL.DESCRIPTION' | translate }}
								</p>
							</div>
						</div>
					</div>

					<!-- Map -->
					<div
						class="col-lg-7 col-12"
						data-aos="fade-up"
						data-aos-duration="1500"
						data-aos-delay="300"
					>
						<div class="map">
							<img
								src="./images/new-images/pixtar-world-map.webp"
								[alt]="'SERVEGLOBAL.ALT' | translate"
								class="w-100 h-auto"
								loading="lazy"
							/>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

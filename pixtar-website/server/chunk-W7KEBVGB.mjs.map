<section class="c-bg-bannerdrk creativity">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto"
				data-aos="fade-up"
				data-aos-duration="2000"
				data-aos-delay="100"
			>
				<div class="label-badge">
					<div class="dot"></div>
					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size12 '"
						>{{ 'HOME.CREATIVITY.TEXT1' | translate }}</span
					>
				</div>
				<div class="row">
					<div
						class="col-md-6 col-sm-6"
						data-aos="fade-up"
						data-aos-duration="1000"
						data-aos-delay="100"
					>
						<div class="creative">
							<h2 class="size90 lufgalight lineheight90">
								<span class="c-text-textcolor6"> {{ 'HOME.CREATIVITY.TEXT2' | translate }} </span>
								<span class="barcely">
									{{ 'HOME.CREATIVITY.TEXT3' | translate }}
								</span>
								<span class="d-block c-text-textcolor5">
									{{ 'HOME.CREATIVITY.TEXT4' | translate }}
								</span>
								<span class="d-block c-text-textcolor5">
									{{ 'HOME.CREATIVITY.TEXT5' | translate }}
								</span>
							</h2>
						</div>
					</div>
					<div
						class="col-md-6 col-sm-6"
						data-aos="fade-up"
						data-aos-duration="1000"
						data-aos-delay="100"
					>
						<div class="d-flex flex-column gap-3 gap-md-5 para-width">
							<p class="mb-0 size24 lufgaregular c-text-textcolor5">
								{{ 'HOME.CREATIVITY.TEXT6' | translate }}
							</p>
							<p class="mb-0 size24 lufgaregular c-text-textcolor5">
								{{ 'HOME.CREATIVITY.TEXT7' | translate }}
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

<section class="u-section-80 whatyouget bannerLightColor" id="what-you-get">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
			>
				<div class="row align-items-start">
					<!-- Left -->
					<div class="whatyouget-left col-lg-5 col-12 mb-3 mb-lg-0">
						<!-- Badge -->
						<div
							class="label-badge"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
							*ngIf="keyExists(sectionKey + '.BADGE')"
						>
							<div class="dot"></div>

							<span
								class="lufgasemibold text-uppercase letterspacing10"
								[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
							>
								{{ sectionKey + '.BADGE' | translate }}
							</span>
						</div>

						<!-- Heading -->
						<h2
							class="size56 lineheight56 minusletterspace2 mb-md-5 mb-sm-3 mb-2 lufgalight"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<ng-container *ngFor="let part of getTitleParts()">
								<br class="d-none d-md-block" *ngIf="part.break" />
								<span [class.lufgasemibold]="part.style === 'bold'">{{ part.text }}</span>
							</ng-container>
						</h2>
					</div>

					<!-- Right -->
					<div class="whatyouget-right col-lg-7 col-12">
						<div class="whatyouget-list">
							<div
								class="whatyouget-item"
								*ngFor="let item of getListItems(); let i = index"
								data-aos="fade-up"
								data-aos-duration="1200"
								[attr.data-aos-delay]="100 + i * 100"
							>
								<div class="whatyouget-number lufgaregular">
									{{ sectionKey + '.LIST.' + item + '.NUMBER' | translate }}
								</div>

								<div class="whatyouget-content">
									<h3 class="lufgaregular size24 lineheight24">
										{{ sectionKey + '.LIST.' + item + '.TITLE' | translate }}
									</h3>

									<p class="lufgaregular size16">
										{{ sectionKey + '.LIST.' + item + '.DESCRIPTION' | translate }}
									</p>

									<div class="whatyouget-tags" *ngIf="getTags(item).length">
										<span
											class="whatyouget-tag size14 lufgaregular"
											*ngFor="let tag of getTags(item)"
										>
											{{ tag }}
										</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

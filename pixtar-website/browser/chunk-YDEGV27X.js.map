<section class="u-section-80 situations bannerLightColor" id="situations">
	<div class="new-container">
		<div class="row">
			<div class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto">
				<div class="label-badge" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="100">
					<div class="dot"></div>
					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
					>
						{{ sectionKey + '.BADGE' | translate }}
					</span>
				</div>
				<div class="row">
					<div class="col-lg-5 col-12">
						<h2
							class="size56 mb-0 lineheight56 minusletterspace2"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<span class="lufgalight">{{ sectionKey + '.TITLE1' | translate }}</span>
							<span class="lufgasemibold">{{ sectionKey + '.TITLE2' | translate }}</span>
						</h2>
					</div>

					<div class="col-lg-7 col-12 mt-5 mt-lg-0">
						<ul class="d-flex flex-column gap-3 gap-lg-5 list-style-none p-0">
							<li
								*ngFor="let key of getItemKeys(); let i = index"
								class="d-flex align-items-start gap-3 gap-lg-4"
								data-aos="fade-up"
								data-aos-duration="2000"
								[attr.data-aos-delay]="100 + i * 50"
							>
								<span class="number lufgalight c-text-textcolor2">{{ i + 1 }}</span>

								<div class="d-flex flex-column align-items-start">
									<h3 class="lufgasemibold text-uppercase size24 mb-1 c-text-textcolor1">
										{{ sectionKey + '.LIST.' + key + '.TITLE' | translate }}
									</h3>

									<p class="lufgaregular size22 mb-0 c-text-textcolor1">
										{{ sectionKey + '.LIST.' + key + '.DESCRIPTION' | translate }}
									</p>
								</div>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

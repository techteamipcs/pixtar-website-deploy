<app-services-banner
	[product]="bannerData"
	[contentClass]="'contentbl'"
	[imagePosition]="
		translationService.currentLang() === 'ar' ? 'banner-left-shift' : 'banner-right-shift'
	"
	[isDark]="false"
	[videoUrl]="baseUrl + '/videos/services/branding-page-video.mp4'"
></app-services-banner>
<app-logos> </app-logos>
<app-position [sectionKey]="'THEPOSITION.BRANDING'"></app-position>

<app-what-you-get [sectionKey]="'WHATYOUGET.BRANDING'"></app-what-you-get>
<app-recent-work-marquee
	serviceName="branding"
	consultationLink="/contact"
	[showTechStack]="false"
></app-recent-work-marquee>

<!-- <app-works-section serviceName="branding" consultationLink="/contact"></app-works-section> -->

<app-golden-ratio></app-golden-ratio>

<app-choose-section [showBadge]="true"></app-choose-section>

<app-ai-section></app-ai-section>

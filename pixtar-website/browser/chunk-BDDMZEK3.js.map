@if (posts$ | async; as posts) {
	@if (posts.length) {
		<section class="u-section-80 blog bannerLightColor" id="blog">
			<div class="new-container">
				<div class="row">
					<div class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto">
						<div class="col-12">
							@if (showTitle) {
								<div
									class="label-badge"
									data-aos="fade-up"
									data-aos-duration="2000"
									data-aos-delay="100"
								>
									<div class="dot"></div>
									<span
										class="lufgasemibold text-uppercase letterspacing10"
										[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
									>
										{{ 'BLOG.BADGE' | translate }}
									</span>
								</div>

								<div
									class="d-flex flex-md-row flex-column justify-content-between align-items-md-end align-items-start gap-3 gap-md-0"
								>
									<h2
										class="size56 lufgaregular mb-0 lineheight56 minusletterspace2"
										data-aos="fade-up"
										data-aos-duration="2000"
										data-aos-delay="100"
									>
										{{ 'BLOG.TITLE1' | translate }}
										<br class="d-none d-md-block" />

										{{ 'BLOG.TITLE2' | translate }}
									</h2>

									<a
										class="lufgasemibold white-slideup-btn size14"
										[href]="blogUrl"
										data-aos="fade-up"
										data-aos-duration="2000"
										data-aos-delay="300"
									>
										<span>{{ 'BLOG.CTA' | translate }}</span>
										<span>{{ 'BLOG.CTA' | translate }}</span>
									</a>
								</div>
							}

							<div class="row mt-2 mt-lg-5 g-4">
								@for (post of posts; track post.id; let i = $index) {
									<div
										class="col-12 col-md-6 col-lg-4"
										data-aos="fade-up"
										data-aos-duration="2000"
										[attr.data-aos-delay]="500 + i * 100"
									>
										<app-blog-card [post]="post" />
									</div>
								}
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	}
}

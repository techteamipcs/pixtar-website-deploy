<section class="cst-tabs">
	<div class="new-container">
		<div class="row">
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
			>
				<h1 class="mb-5 size90 c-text-textcolor1 lufgalight">
					{{ 'PROJECTS.TITLE1' | translate }}
					<span class="mb-5 size90 c-text-textcolor1 lufgasemibold d-block">{{
						'PROJECTS.TITLE2' | translate
					}}</span>
				</h1>
				<!-- Nav pills for category filter -->
				<ul class="nav nav-pills" role="tablist" aria-label="Project categories">
					<li class="nav-item" role="presentation" *ngFor="let category of projectTabs">
						<a
							class="nav-link"
							[class.active]="selectedCategory === category.id"
							role="tab"
							[attr.aria-selected]="selectedCategory === category.id ? 'true' : 'false'"
							[attr.aria-controls]="category.id + '-panel'"
							(click)="getFilterProjects1(category.id)"
							id="{{ category.id }}-tab"
							tabindex="0"
							[attr.aria-label]="
								translationService.currentLang() === 'ar'
									? 'عرض مشاريع ' + category.label_ar
									: 'View ' + category.label + ' projects'
							"
						>
							{{ translationService.currentLang() === 'ar' ? category.label_ar : category.label }}
						</a>
					</li>
				</ul>
			</div>
			<div
				class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
			>
				<div class="tab-content">
					<div
						id="all-panel"
						class="tab-pane active"
						role="tabpanel"
						aria-labelledby="all-tab"
						tabindex="0"
					>
						<div class="container1">
							<div class="row mb-4">
								<div
									class="col-md-4 col-sm-6 col-11 mx-sm-0 mx-auto"
									*ngFor="let project of displayedProjects; let i = index"
								>
									<div class="imgblock project-block">
										<ng-container *ngIf="project.url_key !== '#'; else checkExternal">
											<!-- Case Study -->
											<a
												[routerLink]="getProjectDetailsLink(project.url_key)"
												target="_blank"
												rel="noopener noreferrer"
											>
												<img
													[src]="baseUrl + 'project/' + (project.image_thumnail?.src ?? '')"
													class="galleryimg{{ i }}"
													(mouseenter)="onMouseEnter(i)"
													(mouseleave)="onMouseLeave()"
													width="506"
													height="622"
													alt="{{ project.image_thumnail?.alt ?? '' }}"
													title="{{ project.image_thumnail?.name ?? '' }}"
													loading="lazy"
												/>
											</a>
										</ng-container>

										<ng-template #checkExternal>
											<ng-container
												*ngIf="project.project_link && project.project_link !== '#'; else noLink"
											>
												<!-- External Link -->
												<a [href]="project.project_link" target="_blank" rel="noopener noreferrer">
													<img
														[src]="baseUrl + 'project/' + (project.image_thumnail?.src ?? '')"
														class="galleryimg{{ i }}"
														(mouseenter)="onMouseEnter(i)"
														(mouseleave)="onMouseLeave()"
														width="506"
														height="622"
														alt="{{ project.image_thumnail?.alt ?? '' }}"
														title="{{ project.image_thumnail?.name ?? '' }}"
														loading="lazy"
													/>
												</a>
											</ng-container>
										</ng-template>

										<ng-template #noLink>
											<!-- No Link -->
											<div class="disabled-link">
												<img
													[src]="baseUrl + 'project/' + (project.image_thumnail?.src ?? '')"
													class="galleryimg{{ i }}"
													(mouseenter)="onMouseEnter(i)"
													(mouseleave)="onMouseLeave()"
													width="506"
													height="622"
													alt="{{ project.image_thumnail?.alt ?? '' }}"
													title="{{ project.image_thumnail?.name ?? '' }}"
													loading="lazy"
												/>
											</div>
										</ng-template>
									</div>
								</div>
							</div>
							<div class="mb-4 mt-3" *ngIf="isMorePrasent">
								<div class="linkToPackages mx-auto" *ngIf="isactive">
									<a
										type="button"
										(click)="showMoreProjects()"
										class="d-flex justify-content-start align-items-center"
									>
										<span
											class="text lufgasemibold text-capitalize"
											[class]="translationService.currentLang() === 'ar' ? 'size16 ' : 'size14 '"
										>
											{{ 'BUTTON.LOAD_MORE' | translate }}
										</span>
										<lucide-icon
											[name]="
												translationService.currentLang() === 'ar' ? 'chevron-left' : 'chevron-right'
											"
											class="lucide-arrow-icon"
										></lucide-icon>
										<span class="borderspan sizesmall"> </span>
									</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

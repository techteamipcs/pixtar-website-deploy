@if (!product || product.length === 0) {
	<div class="banner-skeleton" [ngClass]="isDark ? 'bannerDarkColor' : 'bannerLightColor'"></div>
} @else {
	@let item = product[0];

	<section
		class="h-auto d-flex align-items-center u-section-240"
		[ngClass]="[isDark ? 'bannerDarkColor' : 'bannerLightColor']"
	>
		<div class="new-container">
			<div class="row">
				<div
					class="col-xxl-12 col-xl-12 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto position-relative"
				>
					<div class="row pb-lg-5 pb-3 mb-lg-5 mb-3">
						<div class="col-lg-6 col-12">
							<h2 class="size90 lufgalight" [innerHTML]="item | tField: 'short_desc'"></h2>
						</div>

						<div class="col-lg-6 col-12 mt-3 mt-lg-0">
							<div
								class="size24 d-flex align-items-end justify-content-start h-100 text-start"
								[innerHTML]="
									translationService.currentLang() === 'ar' ? item.description_ar : item.description
								"
							></div>
						</div>
					</div>

					@if (videoUrl) {
						<div class="editorial-banner__image">
							<div class="video-frame" #videoFrame>
								<video
									#bannerVideo
									class="w-100 h-100 object-fit-cover"
									[src]="videoUrl"
									autoplay
									loop
									muted
									[muted]="true"
									playsinline
									preload="auto"
									(click)="playVideoInModal()"
									(mouseenter)="onVideoMouseEnter($event)"
									(mousemove)="onVideoMouseMove($event)"
									(mouseleave)="onVideoMouseLeave()"
								></video>

								<div class="video-hover-btn" #videoHoverBtn>
									<div
										class="video-hover-btn__inner"
										#videoHoverBtnInner
										(animationend)="onHoverBtnAnimationEnd()"
									>
										<lucide-icon name="play" class="video-hover-btn__icon"></lucide-icon>
										<span class="video-hover-btn__label size16 lufgasemibold">
											{{ 'VIDEO.VIDEO_CONTENT.TITLE' | translate }}
										</span>
									</div>
								</div>
							</div>
						</div>

						<div class="video-modal" #videoModal>
							<button type="button" class="video-modal__close" (click)="closeVideoModal()">
								<lucide-icon name="x"></lucide-icon>
							</button>
							<div class="video-modal__backdrop" (click)="closeVideoModal()"></div>
							<div class="video-modal__content">
								<video #modalVideo [src]="videoUrl" playsinline preload="metadata"></video>
							</div>
						</div>
					} @else if (item?.media_data?.[0]?.src) {
						<div class="editorial-banner__image">
							<img
								src="./images/new-images/servicesbanner.webp"
								alt=""
								class="w-100 h-100 object-fit-cover"
							/>
							<!-- <img
						[src]="imgUrl + item.media_data[0].src"
						[alt]="item?.media_data[0].alt"
						[title]="item?.name"
						width="1400"
						height="700"
						fetchpriority="high"
						loading="eager"
						decoding="async"
					/> -->
						</div>
					}
				</div>
			</div>
		</div>
	</section>
}
